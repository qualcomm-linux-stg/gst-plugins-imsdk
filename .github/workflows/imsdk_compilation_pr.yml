name: IMSDK_UAT_Compilation_PR
run-name: "IMSDK UAT Compilation: #${{ github.event.workflow_run.pull_requests.number }}"

# Runs in the base repo's context (so secrets are available) after
# IMSDK_UAT_Compilation's save-pr-context job uploads the PR head SHA as an
# artifact. This keeps repository secrets away from fork-authored workflow
# and script changes: the "build" environment below requires maintainer
# approval before any fork code is checked out and executed with secrets.
on:
  workflow_run:
    workflows: ["IMSDK_UAT_Compilation"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  statuses: write

jobs:
  init:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      sdk-url: ${{ steps.urls.outputs.sdk-url }}
      image-urls: ${{ steps.urls.outputs.image-urls }}
      pr-sha: ${{ steps.pr.outputs.sha }}
      pr-number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Download PR context
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pr-context
          path: pr

      - name: Read PR context
        id: pr
        run: |
          echo "number=$(cat pr/NR)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat pr/SHA)" >> "$GITHUB_OUTPUT"

      - name: Report pending status on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ steps.pr.outputs.sha }}",
              state: "pending",
              context: "IMSDK_UAT_Compilation_PR",
              description: "Build running",
            });

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Resolve SDK URL from latest wrynose nightly
        id: urls
        uses: ./.github/actions/resolve-nightly-download-url
        with:
          token: ${{ secrets.QUALCOMM_LINUX_PAT }}
          artifact-token: ${{ secrets.S3_WEBAPP_TOKEN }}

  build:
    needs: init
    runs-on:
      group: GHA-Framework-SelfHosted-RG
      labels:
        - self-hosted
        - framework-prd-u2404-x64-od-ephem

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.init.outputs.pr-sha }}

      - name: Run build
        env:
          S3_WEBAPP_TOKEN: ${{ secrets.S3_WEBAPP_TOKEN }}
          SDK_OBJECT_URL: ${{ needs.init.outputs.sdk-url }}
        run: |
          chmod +x ci/build.sh
          ./ci/build.sh

      - name: Prepare upload directory
        run: |
          mkdir -p upload_dir
          mv imsdk-artifacts.tar.gz upload_dir/

      - name: Generate build URLs JSON
        env:
          IMAGE_URLS: ${{ needs.init.outputs.image-urls }}
        run: |
          python3 - <<'EOF'
          import json, os

          flat = json.loads(os.environ["IMAGE_URLS"])
          nested = {}
          for key, url in flat.items():
              target, image_type = key.split("/", 1)
              nested.setdefault(target, {})[image_type] = url

          with open("upload_dir/build-urls.json", "w") as f:
              json.dump(nested, f, indent=4)
          print(json.dumps(nested, indent=4))
          EOF

      - name: Upload artifacts to S3 bucket
        uses: qualcomm-linux/upload-private-artifact-action@aws-v4
        with:
          path: ${{github.workspace}}/upload_dir
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/
          s3_bucket: qli-prd-framework-gh-artifacts

      - name: Report final status on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ needs.init.outputs.pr-sha }}",
              state: "${{ job.status == 'success' && 'success' || 'failure' }}",
              context: "IMSDK_UAT_Compilation_PR",
              description: "${{ job.status == 'success' && 'Build succeeded' || 'Build failed' }}",
            });
